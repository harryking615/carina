<!doctype html>
<html lang="en">
  <head>

  <style>
    /* styles below */

    @import url("https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap");
    * {
      padding: 0;
      margin: 0;
      box-sizing: border-box;
      font-family: "Roboto", sans-serif;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      max-width: 100vw;
      overflow-x: hidden;
      max-height: 100vh;
    }
    main {
      max-width: 100vw;
      overflow-x: hidden;
      max-height: 100vh;
    }
    .nav__logo {
      width: 145px;
    }
    .nav__container {
      width: 95%;
      max-width: 1200px;
      padding: 1px 1px 0 0;
      background-color: aliceblue;
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin: 0 auto;
      border: 1px solid lightgray;
      border-radius: 1px;
    }
    .nav__description {
      display: flex;
      justify-content: center;
      align-items: center;
    }
    .nav__description-box {
      height: 400px;
      width: 95%;
      margin: 0 auto;
      background-color: lightyellow;
      display: flex;
      justify-content: center;
      align-items: center;
    }
    .nav__description-cameo {
      width: 30%;
    }
    .nav__link {
      margin-left: 16px;
      :text-decoration: none;
      font-size: 16px;
      color: #bd71c2f2;
      font-weight: bold;
      padding: 8px;
    }

    .nav__link:hover {
      /* text-decoration: underline; */
      color: #7342d6;
      font-size: 17px;
      transform: scale(1.03);
      transition: all 300ms ease;
    }
    li {
      list-style-type: none;
      text-decoration: none;
    }
    .footer__container {
      background-color: aliceblue;
      border-top: 1px solid lightgray;
      /* padding: 10px;
      margin: 10px; */
    }
    .footer__link {
      margin-left: 16px;
      text-decoration: none;
      font-size: 15px;
      color: #bd71c2f3;
      font-weight: bold;
    }
    .footer__link:hover {
      /* text-decoration: underline; */
      color: #7342d6;
      font-size: 14px;
    }
    .footer__copyright {
      font-size: 8px;
      color: #bd71c2f5;
      margin-bottom: 18px;
    }
    .footer__list {
      /* padding: 0 8px; */
      margin: 15px 0 15px 0; /* ~padding he likes */
    }
    .row {
      width: 100%;
      max-width: 1200px;
      margin: 0 auto;
    }
    .row__column {
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .nav__container h3 {
      color: #bd71c2f5;
      display: flex;
      justify-content: center;
      align-items: center;
      margin-left: -35px;
    }

    /* styles above */

    <nav>

        <h3>CONTACT ME</h3>
